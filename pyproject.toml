[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "am-strategy-finder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pyarrow>=17"]

[project.scripts]
strategy-finder = "strategy_finder.cli:main"

[tool.setuptools.packages.find]
include = ["strategy_finder*"]
